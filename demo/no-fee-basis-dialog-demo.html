<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="EFK1fCFIvb5jOuQeMtJgTa">
<head data-page-node-id="k3GXekI9xIc5zuZ0cTsjlv">
<meta charset="UTF-8" data-page-node-id="pxQZvVRwpIqqIbVEpezkD7">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="8OjqxODDEEaAnPhbIugpLe">
<title>无费用明细 · 二选一即点即确认（Demo v2）</title>
<style>
  :root{
    --primary:#2563eb; --surface:#ffffff; --bg:#f1f5f9;
    --text:#0f172a; --text-2:#475569; --border:#e2e8f0;
    --danger:#dc2626; --success:#16a34a; --warn:#d97706;
    --radius-lg:16px; --radius-md:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding:32px;min-height:100vh}
  .page-title{font-size:18px;font-weight:700;margin-bottom:6px}
  .page-sub{font-size:13px;color:var(--text-2);margin-bottom:24px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;max-width:960px;margin-bottom:20px}
  .card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card-head h3{font-size:15px;display:flex;align-items:center;gap:8px}
  .badge{font-size:12px;padding:2px 10px;border-radius:999px;background:#fef3c7;color:var(--warn);font-weight:600}
  .btn{border:none;border-radius:var(--radius-md);padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:filter .15s}
  .btn:hover{filter:brightness(.95)}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-secondary{background:#fff;color:var(--text);border:1px solid var(--border)}
  .hint{font-size:12.5px;color:var(--text-2);margin-top:12px;line-height:1.7}
  .hint b{color:var(--text)}
  /* 弹窗：极简二选一 */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:100}
  .overlay.show{display:flex}
  .modal{background:var(--surface);border-radius:var(--radius-lg);width:420px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
  .m-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
  .m-head h4{font-size:14.5px}
  .m-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-2);line-height:1}
  .m-body{padding:18px 20px}
  .m-body .q{font-size:13px;color:var(--text-2);margin-bottom:14px}
  .big-opt{display:block;width:100%;text-align:left;border:1.5px solid var(--border);background:#fff;border-radius:var(--radius-md);padding:13px 16px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;transition:border-color .15s,background .15s;color:var(--text)}
  .big-opt:hover{border-color:var(--primary);background:#eff6ff}
  .big-opt .d{display:block;font-size:12px;font-weight:400;color:var(--text-2);margin-top:3px}
  .other-link{background:none;border:none;color:var(--text-2);font-size:12.5px;cursor:pointer;text-decoration:underline;padding:4px 0}
  .other-box{display:none;margin-top:10px}
  .other-box.show{display:block}
  .note-area{width:100%;border:1.5px solid var(--border);border-radius:var(--radius-md);padding:9px 12px;font-size:13px;font-family:inherit;resize:vertical;min-height:56px;color:var(--text)}
  .note-area:focus{outline:none;border-color:var(--primary)}
  .m-foot{display:none;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border)}
  .m-foot.show{display:flex}
  .btn-ghost{background:#fff;color:var(--text-2);border:1px solid var(--border)}
  /* toast */
  .toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:11px 22px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;display:flex;align-items:center;gap:8px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .ok{color:#4ade80}
  .demo-note{max-width:960px;font-size:12.5px;color:var(--text-2);line-height:1.8;background:#fffbeb;border:1px solid #fde68a;border-radius:var(--radius-md);padding:12px 16px;margin-top:4px}
  .demo-note code{background:#eef2ff;color:var(--primary);padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body data-page-node-id="W5rUx3grrSme9B4UxtFGLR">

<div class="page-title" data-page-node-id="kumeZ29uRDsMDBor6ruODK">无费用明细 · 即点即确认（Demo v2）</div>
<div class="page-sub" data-page-node-id="tz78rD719cdV4HBA8bGZl2">砍掉说明段落、单选框和确认按钮：点口径按钮 = 立即落库。全程 2 次点击。</div>

<!-- 模拟工作台工具栏 -->
<div class="card" data-page-node-id="zCLe0hafBFIkdFrDLB2bZM">
  <div class="card-head" data-page-node-id="Xx2zQuIWgQ0ZJRP8SiqPRy">
    <h3 data-page-node-id="jddbWKD4KqLH2bIQ5rwaSQ">🧮 ② 扣费明细表 <span class="badge" data-page-node-id="XIv0fO7dYXAY62EDQtjbK5">编辑中</span></h3>
    <span style="flex:1" data-page-node-id="Gk8DmGpKfwLKnksrRQqCPC"></span>
    <button class="btn btn-secondary" onclick="openModal()" data-page-node-id="RoRu4bJDtWcVkAFLegBwFE">⊘ 无费用明细</button>
    <button class="btn btn-primary" data-page-node-id="o3kITxubWcZvSIZFv2F5ir">✔ 确认明细</button>
  </div>
  <div class="hint" data-page-node-id="Iop7tirPr3Yr0Wkjetj2y6">按钮由「查无记录·无费用明细」改名为<b data-page-node-id="XVHGUOWBOU9fv8IZQn3jRt">「无费用明细」</b>；点击弹出两口径大按钮，点选即确认。</div>
</div>

<!-- 弹窗 -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()" data-page-node-id="kbA9HPGkyCHcvQcinHjFGx">
  <div class="modal" data-page-node-id="GcHLqJtSgND3AKOuQpTTQO">
    <div class="m-head" data-page-node-id="n8dEAOjwFD6kM1jCqy657c">
      <h4 data-page-node-id="1uZlNwq1IhO5EPIU97APXF">⊘ 无费用明细确认</h4>
      <button class="m-close" onclick="closeModal()" data-page-node-id="Iwb3xewmWwWHTAwa9wA0T3">×</button>
    </div>
    <div class="m-body" data-page-node-id="enTvJVcpI1JStc3mCE4TD9">
      <div class="q" data-page-node-id="FteScAgLVemCJVb3IepODz">按 0 元口径通过费用闸门，请选择留痕口径：</div>

      <button class="big-opt" onclick="confirmAs('三系统查无记录，无费用明细')" data-page-node-id="rHwsr0J7oI1fh2vunBOOFX">
        三系统查无记录
        <span class="d" data-page-node-id="ch3LUlyqGuEwykTTXobN3G">三系统未命中该学员，无合同 / 缴费依据可查</span>
      </button>

      <button class="big-opt" onclick="confirmAs('非费用类投诉，无费用争议')" data-page-node-id="UVLf8LWnQrijLHYG2plQ1x">
        非费用类投诉，无费用争议
        <span class="d" data-page-node-id="KLUNRzItiGNJAIF3zylRfk">投诉不涉及收费 / 扣费 / 退费（如服务态度、学时纠纷等）</span>
      </button>

      <button class="other-link" onclick="showOther()" data-page-node-id="JOzyKjKIdcNQNm8WU6004S">其他情况，自行填写…</button>
      <div class="other-box" id="otherBox" data-page-node-id="ZHytIxRbHAoP0AZPKDWDBW">
        <textarea class="note-area" id="note" placeholder="如实填写无费用明细的原因（必填）"></textarea>
      </div>
    </div>
    <div class="m-foot" id="mFoot" data-page-node-id="ftR3Gxx9gUsUrWO2CFPOlt">
      <button class="btn btn-ghost" onclick="closeModal()" data-page-node-id="m8cjnqbLO7c4EbY1LHw9kQ">取消</button>
      <button class="btn btn-primary" onclick="confirmOther()" data-page-node-id="ARyAa84v1yhLR8rqMBdozS">确认</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" data-page-node-id="Ol8yQIRGjm8XIajiPrU8p4"><span class="ok" data-page-node-id="l9tVzV9edvSctkDaiHgGKx">✔</span><span id="toastMsg" data-page-node-id="zTMlYgtxEltbQvlEDjJ160"></span></div>

<div class="demo-note" data-page-node-id="eStPKjtCdpg0PIT980SQEF">
  <b data-page-node-id="E14yW39B0K7mt0U85rJtBz">对比：</b>现有操作 = 1 次点击（文案失实）；本方案 = 2 次点击（留痕如实）。无阅读段落、无单选框、无额外确认步。
  「其他」入口默认收起，仅极少数场景展开。留痕写入 <code data-page-node-id="b2B3tEzeBH80jNyIa9hoZV">fee_confirm_note</code>，归档闸门即通过；后续拿到合同仍可解锁重新分析确认。
</div>

<script>
  function openModal(){ document.getElementById("overlay").classList.add("show"); }
  function closeModal(){
    document.getElementById("overlay").classList.remove("show");
    document.getElementById("otherBox").classList.remove("show");
    document.getElementById("mFoot").classList.remove("show");
  }
  function confirmAs(note){
    closeModal();
    toast("已确认（无费用明细）· 留痕：" + note);
  }
  function showOther(){
    document.getElementById("otherBox").classList.add("show");
    document.getElementById("mFoot").classList.add("show");
    document.getElementById("note").focus();
  }
  function confirmOther(){
    const note = document.getElementById("note").value.trim();
    if(!note){ alert("留痕备注不能为空。"); return; }
    closeModal();
    toast("已确认（无费用明细）· 留痕：" + note);
  }
  function toast(msg){
    const t = document.getElementById("toast");
    document.getElementById("toastMsg").textContent = msg;
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"), 2600);
  }
</script>
</body>
</html>
