<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>学员投诉处理系统</title>
<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<style>
  :root{
    --color-primary:#2563EB;
    --color-primary-dark:#1D4ED8;
    --color-primary-50:#EFF6FF;
    --brand-gradient:linear-gradient(180deg,#1E3A8A,#2563EB);
    --color-text:#0F172A;
    --color-text-secondary:#475569;
    --color-text-disabled:#94A3B8;
    --color-border:#E2E8F0;
    --color-bg:#EEF3F8;
    --color-surface:#FFFFFF;
    --color-success:#16A34A;
    --color-danger:#DC2626;
    --color-danger-50:#FEF2F2;
    --font-sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--font-sans);
    background:linear-gradient(135deg,#1E3A8A 0%,#2563EB 60%,#3B82F6 100%);
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    color:var(--color-text);
  }
  .login-card{
    background:var(--color-surface);
    padding:40px 36px 32px;
    border-radius:16px;
    box-shadow:0 24px 64px rgba(15,23,42,.18),0 4px 12px rgba(15,23,42,.06);
    width:360px;
  }
  .brand{
    display:flex; align-items:center; gap:10px; margin-bottom:24px;
  }
  .brand-icon{
    width:36px; height:36px; border-radius:8px;
    background:var(--brand-gradient);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:18px;
  }
  .brand h1{ font-size:16px; margin:0; color:var(--color-text); font-weight:600; }
  .brand .sub{ font-size:12px; color:var(--color-text-secondary); margin-top:2px; }
  .form-group{ margin-bottom:16px; }
  .form-group label{ display:block; font-size:13px; color:var(--color-text-secondary); margin-bottom:6px; }
  .form-group input{
    width:100%; padding:11px 12px;
    border:1px solid var(--color-border); border-radius:6px;
    font-size:14px; transition:border-color .15s;
    background:#fff; color:var(--color-text);
  }
  .form-group input:focus{ outline:none; border-color:var(--color-primary); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
  .login-btn{
    width:100%; padding:11px;
    background:var(--color-primary); color:#fff;
    border:none; border-radius:6px; font-size:14px; font-weight:500;
    cursor:pointer; transition:background .15s; margin-top:8px;
  }
  .login-btn:hover{ background:var(--color-primary-dark); }
  .login-btn:disabled{ background:#94A3B8; cursor:not-allowed; }
  .err{
    color:var(--color-danger); font-size:12px; margin-top:12px; min-height:16px;
    background:var(--color-danger-50); padding:8px 10px; border-radius:4px;
    display:none;
  }
  .err.show{ display:block; }
  .footer{ text-align:center; color:var(--color-text-disabled); font-size:11px; margin-top:20px; }
</style>
</head>
<body>
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="brand">
      <div class="brand-icon">K</div>
      <div>
        <h1>投诉处理系统</h1>
        <div class="sub">学员投诉自动处理工作台</div>
      </div>
    </div>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" name="username" autocomplete="username" autofocus>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" name="password" autocomplete="current-password">
    </div>
    <button class="login-btn" type="submit">登录</button>
    <div class="err" id="err"></div>
    <div class="footer">首次登录后请立即修改默认密码</div>
  </form>
<script>
  const form = document.getElementById('loginForm');
  const errEl = document.getElementById('err');
  const btn = form.querySelector('button');
  function showErr(msg){
    errEl.textContent = msg;
    errEl.classList.add('show');
  }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.remove('show');
    btn.disabled = true; btn.textContent = '登录中...';
    const fd = new FormData(form);
    try {
      const r = await fetch('/api/session/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username: fd.get('username'), password: fd.get('password') }),
      });
      const data = await r.json();
      if (data.success) {
        window.location.href = '/';
      } else {
        showErr(data.error || '登录失败');
        btn.disabled = false; btn.textContent = '登录';
      }
    } catch (err) {
      showErr('网络异常，请重试');
      btn.disabled = false; btn.textContent = '登录';
    }
  });
</script>
</body>
</html>
