version: "1.0"
updated_at: "2026-08-31"
description: |
  合同模板库：用于「上传合同」图片的模板识别与字段提取。
  合同种类有限（7 份模板，合并为 6 类），条款标准化，变量仅金额、勾选、手写内容。
  报名人信息（姓名/身份证/报名日期）不识别图片，直接从内部系统或第三系统取。

global:
  student_info_source: "internal_system"  # internal_system | third_system
  note: |
    2024-03-15 后报名的学员大部分使用电子合同（东莞驾培平台），走 PDF 下载路径。
    本模板库用于处理纸质合同图片上传场景（主要是 2024-03-15 前的老学员）。

  # 通用字段（所有模板共有）
  common_fields:
    contract_code:
      位置: "右上角"
      说明: "合同编号"
      类型: "string"
      必填: false
    signing_date:
      位置: "末尾"
      说明: "签订日期（手写）"
      类型: "string"  # YYYY-MM-DD
      必填: true
    handwritten_annotations:
      说明: "所有手写内容（金额、勾选、日期、签名、备注、修改）"
      类型: "array"
      必填: true
      格式: [{"location": "位置", "content": "手写内容原文"}]
    special_terms:
      说明: "非标准条款原文（模板库中没有的条款）"
      类型: "array"
      必填: false

templates:
  # ========== 2019 年三份配套合同 ==========
  # 学员需同时签 3 份：培训合同 + 服务合同 + 代缴合同
  - template_id: "2019培训合同"
    name: "东莞市机动车驾驶员培训合同（2019）"
    year: 2019
    pages: 2
    category: "training"  # 培训合同（不含报考服务）
    配套合同: ["2019服务合同", "2019代缴合同"]
    识别特征:
      - "东莞市机动车驾驶员培训合同"
      - "不包含协助乙方驾驶考试服务的相关事项"
      - "理论培训时间    学时"
      - "第五条 退学退费"
    字段定义:
      total_fee:
        位置: "第四条（一）2 或 3"
        说明: "培训费用总额合计"
        类型: "number"
        提取规则: "普通培训填总额；预约培训=理论+实操；按时收费=第一阶段+第二阶段+第三阶段"
      theory_fee:
        位置: "第四条（一）2 或 3"
        说明: "理论培训费及相关手续费"
        类型: "number"
      practical_fee:
        位置: "第四条（一）1/2/3"
        说明: "实际操作培训费（含驾驶模拟器培训费）"
        类型: "number"
        单位: "元 或 元/学时"
      penalty_rate:
        位置: null
        说明: "2019 培训合同无违约金条款"
        类型: "number"
        默认值: null
      service_fee:
        位置: null
        说明: "培训合同不含服务费（在 2019服务合同 中）"
        类型: "number"
        默认值: null
      exam_fee_included:
        位置: null
        说明: "培训合同不含考试费（在 2019代缴合同 中）"
        类型: "boolean"
        默认值: null
      makeup_fee_included:
        位置: null
        说明: "培训合同不含补考费（在 2019代缴合同 中）"
        类型: "boolean"
        默认值: null
    退费规则:
      位置: "第五条"
      说明: "无违约金，只扣相关手续费和已发生的培训费"
      预约培训: "理论培训前退学退理论费；理论培训后退学不退"
      普通培训: "理论培训前退学退全部；理论培训后退学扣手续费+已发生培训费"
    不退费条款:
      - 条款: "第五条（二）"
        原文: "实行预约培训的，如乙方在参加理论培训后退学，乙方已交的费用不退"
        适用场景: "预约培训且已参加理论培训"
        回复函引用: "根据合同第五条（二）约定，乙方参加理论培训后退学的，已交费用不退"
      - 条款: "第五条（三）"
        原文: "实行普通培训和按时收费的，如乙方在参加理论培训后退学，甲方扣除相关手续费和已发生的培训费后退回乙方剩余的费用"
        适用场景: "普通培训且已参加理论培训"
        回复函引用: "根据合同第五条（三）约定，参加理论培训后退学的，扣除相关手续费和已发生的培训费"
      - 条款: "第六条"
        原文: "本合同的有效期限为自合同生效之日起三年"
        适用场景: "合同期满（报名超3年）"
        回复函引用: "根据合同第六条约定，合同有效期限为自合同生效之日起三年，现已超过合同有效期"

  - template_id: "2019服务合同"
    name: "东莞市机动车驾驶报考协助服务合同（2019）"
    year: 2019
    pages: 2
    category: "service"  # 服务合同（不含培训）
    配套合同: ["2019培训合同", "2019代缴合同"]
    识别特征:
      - "东莞市机动车驾驶报考协助服务合同"
      - "不包含驾驶培训服务的相关事项"
      - "受理服务费、综合服务费、学员卡"
    字段定义:
      total_fee:
        位置: null
        说明: "服务合同不含培训费（在 2019培训合同 中）"
        类型: "number"
        默认值: null
      service_fee:
        位置: "第三条"
        说明: "受理服务费、综合服务费、学员卡等代交专用款项合计"
        类型: "number"
        提取规则: "费用合计金额"
      exam_fee_included:
        位置: "第三条1"
        说明: "代缴的考试行政事业等收费项目"
        类型: "boolean"
        提取规则: "有代缴项目=true"
      makeup_fee_included:
        位置: null
        说明: "服务合同不含补考费（在 2019代缴合同 中）"
        类型: "boolean"
        默认值: null
    退费规则:
      位置: "第四条"
      说明: "扣除已完成科目服务费及已代缴考试费后退还剩余"
    不退费条款:
      - 条款: "第五条"
        原文: "本合同履行期限为自合同生效之日起至《机动车驾驶技能准考证明》有效期届满，如乙方没有取得《技能证》，本合同的有效期为三年"
        适用场景: "合同期满（报名超3年或技能证过期）"
        回复函引用: "根据合同第五条约定，合同履行期限至《技能证》有效期届满（未取得《技能证》的为三年），现已超过合同有效期"
      - 条款: "第八条（二）"
        原文: "合同履行期限届满，本合同终止"
        适用场景: "合同期满"
        回复函引用: "根据合同第八条（二）约定，合同履行期限届满，本合同终止"

  - template_id: "2019代缴合同"
    name: "东莞市机动车驾驶报考代收代交考试费合同（2019）"
    year: 2019
    pages: 2
    category: "agency"  # 代缴合同（不含培训）
    配套合同: ["2019培训合同", "2019服务合同"]
    识别特征:
      - "东莞市机动车驾驶报考代收代交考试费合同"
      - "代收代交服务费、考试费、补考费、工本费"
    字段定义:
      total_fee:
        位置: null
        说明: "代缴合同不含培训费（在 2019培训合同 中）"
        类型: "number"
        默认值: null
      service_fee:
        位置: null
        说明: "代缴合同不含服务费（在 2019服务合同 中）"
        类型: "number"
        默认值: null
      exam_fee_included:
        位置: "第三条（一）1"
        说明: "科目一/科目二/科目三/工本费"
        类型: "boolean"
        提取规则: "有明细=true"
      makeup_fee_included:
        位置: "第三条（二）"
        说明: "补考费由甲方按公安部门标准代交"
        类型: "boolean"
        提取规则: "有此项=true"
    退费规则:
      位置: "第四条"
      说明: "扣除已完成科目服务费及已代收代交考试费后退还剩余"
    不退费条款:
      - 条款: "第五条"
        原文: "本合同履行期限为自合同生效之日起至《机动车驾驶技能准考证明》有效期届满，如乙方没有取得《技能证》，本合同的有效期为三年"
        适用场景: "合同期满（报名超3年或技能证过期）"
        回复函引用: "根据合同第五条约定，合同履行期限至《技能证》有效期届满（未取得《技能证》的为三年），现已超过合同有效期"
      - 条款: "第八条（二）"
        原文: "合同履行期限届满，本合同终止"
        适用场景: "合同期满"
        回复函引用: "根据合同第八条（二）约定，合同履行期限届满，本合同终止"

  # ========== 2021-2022 定稿（合并版） ==========
  - template_id: "2021-2022定稿"
    name: "东莞市机动车驾驶员培训合同（2021-2022 定稿）"
    year: [2021, 2022]
    pages: 3
    category: "training_merged"  # 合并版（培训+考试费代收+协助报考服务费）
    识别特征:
      - "第四条（三）协助报考服务费"  # 关键特征：2023 没有独立项
      - "第五条  退学退费"  # 2023 是第八条
      - "准驾车型: □A1 □A2 □A3 □B1"  # 2023 只有 C1/C2/C5
      - "违约金为全部培训费用的10%"
    字段定义:
      total_fee:
        位置: "第四条（一）1（2）或（3）"
        说明: "培训费用总额合计"
        类型: "number"
        提取规则: "普通培训填总额；按时收费=第一阶段+第二阶段+第三阶段；预约培训=理论+实操"
      theory_fee:
        位置: "第四条（一）1（1）（2）（3）"
        说明: "理论培训费及相关手续费"
        类型: "number"
      practical_fee:
        位置: "第四条（一）1（1）（2）（3）"
        说明: "实际操作培训费"
        类型: "number"
        单位: "元 或 元/学时"
      penalty_rate:
        位置: "第五条（一）1（2）注"
        说明: "违约金为全部培训费用的比例"
        类型: "number"
        默认值: 0.1
        提取规则: "模板默认 10%，但可能有手写修改（如罗炳灿案手写 20%）"
      service_fee:
        位置: "第四条（三）协助报考服务费"
        说明: "协助报考服务费合计（报名服务和学员卡费+科目一服务费+科目二三服务费）"
        类型: "number"
      exam_fee_included:
        位置: "第四条（二）1"
        说明: "代收代交考试费、工本费、补考费"
        类型: "boolean"
        提取规则: "有明细=true"
      makeup_fee_included:
        位置: "第四条（二）2"
        说明: "补考费由谁承担"
        类型: "boolean"
        提取规则: "勾选'补考费由乙方承担'=false，'补考费由甲方承担并代交'=true"
    退费规则:
      位置: "第五条（一）1（2）"
      说明: "按阶段退费表"
      退费表: |
        乙方在公安部门受理前退学的：已收费用－违约金
        乙方在公安部门受理后退学的：已收费用－理论培训费用及相关手续费－违约金
        乙方在实操阶段退学的：已收费用－理论培训费用及相关手续费－已发生的实际操作培训费－违约金
    特殊条款:
      转校费: "第十二条：500 元"
    不退费条款:
      - 条款: "第五条（一）1（1）"
        原文: "实行预约培训的，如乙方在参加理论培训后退学，乙方已交的费用不退"
        适用场景: "预约培训且已参加理论培训"
        回复函引用: "根据合同第五条（一）1（1）约定，乙方参加理论培训后退学的，已交费用不退"
      - 条款: "第六条"
        原文: "本合同有效期限为自合同生效之日起至《机动车驾驶技能准考证明》有效期届满，如乙方没有取得《技能证》，本合同有效期为三年"
        适用场景: "合同期满（报名超3年或技能证过期）"
        回复函引用: "根据合同第六条约定，合同有效期限至《技能证》有效期届满（未取得《技能证》的为三年），现已超过合同有效期"
      - 条款: "第九条（二）"
        原文: "合同有效期限届满，本合同终止，甲方无须退款"
        适用场景: "合同期满"
        回复函引用: "根据合同第九条（二）约定，合同有效期限届满，本合同终止，甲方无须退款"
      - 条款: "第九条（四）"
        原文: "乙方参加科目二或科目三单科5次不及格的，《机动车驾驶技能准考证明》作废，本合同终止，甲方无须退款"
        适用场景: "科目二/三单科5次不及格"
        回复函引用: "根据合同第九条（四）约定，乙方参加科目二或科目三单科5次不及格，《技能证》作废，本合同终止，甲方无须退款"

  # ========== 2023 分店 ==========
  - template_id: "2023分店"
    name: "东莞市机动车驾驶员培训合同-20231227（分店）"
    year: 2023
    pages: 3
    category: "training_merged"
    识别特征:
      - "准驾车型:□C1 □C2 □C5"  # 2021-2022 是 A1~P
      - "第八条  退学退费"  # 2021-2022 是第五条
      - "场地费"  # 关键特征：分校没有
      - "违约金为全部培训费用的20%"
    字段定义:
      total_fee:
        位置: "第四条（一）1（1）或（3）"
        说明: "培训费用总额合计（包含建档费/学员IC卡/各阶段培训费及相关手续费）"
        类型: "number"
        提取规则: "普通培训填总额；按时收费=第一阶段+第二阶段+第三阶段"
      theory_fee:
        位置: "第四条（一）1（3）第一阶段"
        说明: "理论培训费用及相关手续费"
        类型: "number"
      practical_fee:
        位置: "第四条（一）1（3）第二、三阶段"
        说明: "科目二/科目三实际操作培训费"
        类型: "number"
        单位: "元 或 元/学时"
      penalty_rate:
        位置: "第八条备注"
        说明: "违约金为全部培训费用的比例"
        类型: "number"
        默认值: 0.2
      service_fee:
        位置: "第八条退费表'基础服务（必扣项）服务费'"
        说明: "服务费"
        类型: "number"
        默认值: 600
      archive_fee:
        位置: "第八条退费表'基础服务（必扣项）建档费'"
        说明: "建档费"
        类型: "number"
        默认值: 300
      ic_card_fee:
        位置: "第八条退费表'基础服务（必扣项）学员IC卡'"
        说明: "学员IC卡费"
        类型: "number"
        默认值: 100
      site_fee:
        位置: "第八条退费表'基础服务（必扣项）场地费'"
        说明: "场地费（仅分店有）"
        类型: "number"
        默认值: 700
      subject2_unit_price:
        位置: "第八条退费表'实操培训（依实项）科目二实操'"
        说明: "科目二学时单价"
        类型: "number"
        默认值: "C1=120, C2=150"
        提取规则: "根据学员准驾车型取对应单价"
      subject3_unit_price:
        位置: "第八条退费表'实操培训（依实项）科目三实操'"
        说明: "科目三学时单价"
        类型: "number"
        默认值: "C1=120, C2=150"
        提取规则: "根据学员准驾车型取对应单价"
      exam_fee_included:
        位置: "第四条（三）1"
        说明: "代收代交考试费、工本费、补考费"
        类型: "boolean"
        提取规则: "有明细=true"
      makeup_fee_included:
        位置: "第四条（三）2"
        说明: "补考费由谁承担"
        类型: "boolean"
        提取规则: "勾选'补考费由乙方承担'=false，'补考费由甲方承担'=true"
    退费规则:
      位置: "第八条（一）1（1）"
      说明: "按退费表：扣除基础服务+其他必扣项+已代收考试费+已产生实操培训费+违约金20%后退还剩余"
    特殊条款:
      转校费: "第十二条：500 元及已进行的实操培训费"
    不退费条款:
      - 条款: "第五条"
        原文: "本合同自签订之日起生效，有效期为三年"
        适用场景: "合同期满（报名超3年）"
        回复函引用: "根据合同第五条约定，合同有效期为三年，现已超过合同有效期"
      - 条款: "第九条（二）"
        原文: "乙方在合同有效期内未完成《机动车驾驶培训教学与考试大纲》所规定的学时，而领取驾驶证，视乙方单方违约，本合同终止，学员所交培训费用不予退回"
        适用场景: "未完成学时但已领证"
        回复函引用: "根据合同第九条（二）约定，乙方在合同有效期内未完成规定学时，视乙方单方违约，所交培训费用不予退回"
      - 条款: "第九条（四）"
        原文: "乙方因自身（含客观/不可抗力）原因，本合同有效期内未完成《机动车驾驶培训教学与考试大纲》所规定的学时或未取得驾驶证的，本合同终止，甲方不负违约责任，乙方所交培训费用不予退回"
        适用场景: "合同期满未完成学时或未取得驾驶证"
