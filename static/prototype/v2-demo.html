<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v2 原型 · 投诉处理系统</title>
<style>
/* ===== Token（DESIGN.md）===== */
:root{
  --color-primary:#2563EB; --color-primary-dark:#1D4ED8; --color-primary-50:#EFF6FF;
  --brand-gradient:linear-gradient(180deg,#1E3A8A,#2563EB);
  --color-brand-accent:#4F46E5;
  --color-success:#16A34A; --color-success-50:#F0FDF4;
  --color-warning:#D97706; --color-warning-50:#FFFBEB;
  --color-danger:#DC2626;  --color-danger-50:#FEF2F2;
  --color-text:#0F172A; --color-text-secondary:#64748B;
  --color-border:#E2E8F0; --color-surface-50:#F8FAFC; --color-bg:#EEF3F8; --color-surface:#FFFFFF;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.04);
  --shadow-md:0 4px 12px rgba(15,23,42,.08);
  --shadow-lg:0 12px 32px rgba(15,23,42,.12);
  --radius:8px; --radius-lg:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100%;background:var(--color-bg);color:var(--color-text);
  font:400 13px/1.6 "PingFang SC","Microsoft YaHei",-apple-system,sans-serif;}
.mono{font-family:"SF Mono",Menlo,Consolas,monospace}

.app{display:flex;min-height:100vh}
.sidebar{width:240px;flex:none;background:var(--brand-gradient);color:#fff;display:flex;flex-direction:column;
  padding:20px 12px;position:sticky;top:0;height:100vh}
.sidebar .brand{font:700 15px/1.3 inherit;padding:0 8px 20px}
.sidebar .brand small{display:block;font-weight:400;font-size:11px;color:rgba(255,255,255,.62)}
.nav-link{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.78);padding:10px 16px;border-radius:8px;
  cursor:pointer;font-weight:600;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-size:13px}
.nav-link:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-link.active{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 3px 0 0 var(--color-brand-accent)}
.sidebar .footer{margin-top:auto;padding:0 8px;font-size:11px;color:rgba(255,255,255,.62)}
.main{flex:1;min-width:0;padding:24px 32px;max-width:1500px}

.btn{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 inherit;padding:8px 16px;border-radius:var(--radius);
  border:1px solid transparent;cursor:pointer;background:none;color:var(--color-text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
.btn-primary{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.btn-primary:hover:not(:disabled){background:var(--color-primary-dark);box-shadow:var(--shadow-md)}
.btn-secondary{background:#fff;color:var(--color-text);border-color:var(--color-border)}
.btn-secondary:hover:not(:disabled){background:var(--color-surface-50);border-color:var(--color-text-secondary)}
.btn-ghost{color:var(--color-danger);border-color:transparent}
.btn-ghost:hover:not(:disabled){background:var(--color-danger-50)}
.btn-sm{padding:6px 12px;font-size:12px}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.card-header{padding:12px 16px;border-bottom:1px solid var(--color-border);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-body{padding:16px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;font:600 11px/1.3 inherit;border-radius:999px;border:1px solid transparent}
.badge-pending{background:var(--color-warning-50);color:var(--color-warning);border-color:#FDE68A}
.badge-processing{background:var(--color-primary-50);color:var(--color-primary);border-color:#BFDBFE}
.badge-completed{background:var(--color-success-50);color:var(--color-success);border-color:#A7F3D0}
.badge-muted{background:var(--color-surface-50);color:var(--color-text-secondary);border-color:var(--color-border)}
.table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.45}
.table th{padding:10px 14px;text-align:left;font-weight:600;font-size:12px;color:var(--color-text-secondary);
  background:var(--color-surface-50);border-bottom:2px solid var(--color-border);white-space:nowrap}
.table td{padding:10px 14px;border-bottom:1px solid var(--color-border);vertical-align:middle}
.table tbody tr:hover{background:var(--color-surface-50)}
.form-label{display:block;font-weight:600;font-size:12px;color:var(--color-text-secondary);margin-bottom:6px}
.form-control{width:100%;padding:8px 12px;font-size:13px;color:var(--color-text);border:1.5px solid var(--color-border);
  border-radius:var(--radius);background:#fff;font-family:inherit;transition:border-color .15s}
.form-control:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-50)}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:20px}
.kpi{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-sm)}
.kpi .num{font-size:26px;font-weight:700;line-height:1.25}
.kpi .lbl{font-size:12px;color:var(--color-text-secondary)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

.stepper{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:8px 0}
.step{display:flex;align-items:center;gap:6px;cursor:pointer;background:none;border:none;font:inherit;color:var(--color-text-secondary);white-space:nowrap;padding:4px 6px;border-radius:8px}
.step .dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#fff;border:2px solid var(--color-border);color:var(--color-text-secondary);font-weight:700;flex:none}
.step.active{color:var(--color-text)}
.step.active .dot{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.step.done{color:var(--color-success)}
.step.done .dot{background:var(--color-success);border-color:var(--color-success);color:#fff}
.step-line{flex:1;height:2px;background:var(--color-border);min-width:18px}

.proto-banner{z-index:4000;background:#7C2D12;color:#FFEDD5;font-size:12px;padding:6px 16px;text-align:center}
.proto-banner b{color:#FDBA74}
.proto-banner button{background:none;border:1px solid #FDBA74;color:#FDBA74;border-radius:6px;font-size:11px;padding:1px 8px;margin-left:10px;cursor:pointer}
body.banner-off .proto-banner{display:none}
.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;align-items:center;gap:2px;
  background:#0F172A;color:#fff;border-radius:999px;padding:6px 10px;box-shadow:var(--shadow-lg);font-size:12px}
.switcher button{background:none;border:none;color:#94A3B8;font-size:16px;cursor:pointer;padding:2px 10px;border-radius:999px}
.switcher button:hover{background:rgba(255,255,255,.12);color:#fff}
.switcher .vlabel{min-width:190px;text-align:center;font-weight:600}
.toasts{position:fixed;top:52px;right:20px;z-index:5000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:10px;box-shadow:var(--shadow-lg);color:#fff;font-size:13px;max-width:360px;animation:slidein .2s ease}
.toast-success{background:var(--color-success)} .toast-danger{background:var(--color-danger)} .toast-info{background:var(--color-primary)}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1}}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:4500;display:flex;align-items:center;justify-content:center}
.modal-content{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:480px;max-width:92vw}
.modal-content .m-head{padding:14px 18px;font-weight:700;border-bottom:1px solid var(--color-border)}
.modal-content .m-body{padding:18px}
.modal-content .m-foot{padding:12px 18px;border-top:1px solid var(--color-border);display:flex;justify-content:flex-end;gap:8px}

.page-title{font-size:20px;font-weight:700;margin-bottom:20px}
.chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--color-border);background:#fff;border-radius:999px;padding:5px 14px;font-size:12px;cursor:pointer;font-weight:600;color:var(--color-text-secondary)}
.chip.on{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.case-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.case-head .who{font-size:17px;font-weight:700}
.case-head .meta{color:var(--color-text-secondary);font-size:12px;margin-top:2px;display:flex;gap:12px;flex-wrap:wrap}
.case-head .actions{margin-left:auto;display:flex;gap:8px}
.panel{scroll-margin-top:16px}
.panel + .panel{margin-top:20px}
.hint{font-size:12px;color:var(--color-text-secondary)}
.fee-total{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap;padding:12px 16px;background:var(--color-surface-50);border-radius:var(--radius);margin-top:12px}
.fee-total .big{font-size:24px;font-weight:800;color:var(--color-success)}
.amt-td{text-align:center;font-weight:600;font-family:"SF Mono",Menlo,Consolas,monospace;white-space:nowrap}
/* 合同预览 */
.contract-wrap{display:grid;grid-template-columns:1fr 250px;gap:16px;height:min(62vh,520px)}
.contract-doc{overflow:auto;border:1px solid var(--color-border);border-radius:var(--radius);padding:18px 22px;
  font-family:"Songti SC","STSong","SimSun",serif;font-size:13px;line-height:2;background:#fff}
.contract-doc h4{font-size:14px;text-align:center;margin-bottom:12px}
.contract-doc p{margin-bottom:10px;text-indent:2em}
.contract-doc p.hl{background:#FEF9C3;border-radius:4px;transition:background .3s}
.contract-side{overflow:auto;display:flex;flex-direction:column;gap:8px}
.contract-side .fi{border:1.5px solid var(--color-border);border-radius:var(--radius);padding:8px 12px;cursor:pointer;font-size:12px;line-height:1.6;background:#fff}
.contract-side .fi:hover{border-color:var(--color-primary);box-shadow:var(--shadow-sm)}
.contract-side .fi b{display:block}
.contract-side .fi .b{color:var(--color-text-secondary)}
td[contenteditable="true"]:focus{outline:2px solid var(--color-primary);outline-offset:-2px;background:var(--color-primary-50);border-radius:4px}
.gate-item{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13px}
.gate-ok{color:var(--color-success)} .gate-no{color:var(--color-danger)}
.path-tree{background:#0F172A;color:#E2E8F0;border-radius:var(--radius);padding:14px 16px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px;line-height:1.7;overflow-x:auto}
.path-tree .ok{color:#4ADE80}.path-tree .dim{color:#64748B}.path-tree .warn{color:#FBBF24}

/* 配合度图标（形状区分：✓圆 / —圆 / ✕圆） */
.coop-opt{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--color-border);border-radius:999px;padding:6px 16px 6px 8px;cursor:pointer;font-weight:700;margin-right:8px;background:#fff;font-size:13px}
.cico{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;flex:none}
.coop-opt.on-好{border-color:var(--color-success);color:var(--color-success);background:var(--color-success-50)}
.coop-opt.on-中{border-color:var(--color-warning);color:var(--color-warning);background:var(--color-warning-50)}
.coop-opt.on-差{border-color:var(--color-danger);color:var(--color-danger);background:var(--color-danger-50)}

.rail{position:sticky;top:24px;align-self:start;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 48px);overflow:auto}
.student-card .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--color-border);font-size:12.5px}
.student-card .row:last-child{border:none}
.student-card .k{color:var(--color-text-secondary);flex:none}
.student-card .v{text-align:right;word-break:break-all}
.tl-item{position:relative;padding:0 0 10px 18px;font-size:12px;line-height:1.65}
.tl-item:before{content:'';position:absolute;left:4px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--color-primary)}
.tl-item:last-child{padding-bottom:0}
.tl-item .d{color:var(--color-text-secondary);font-family:"SF Mono",Menlo,monospace;font-size:11px;margin-right:6px}
.mini-case{padding:10px 14px;border-bottom:1px solid var(--color-border);cursor:pointer}
.mini-case:last-child{border-bottom:none}
.mini-case:hover{background:var(--color-surface-50)}
.mini-case.on{background:var(--color-primary-50)}
.mini-case .l1{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
.mini-case .l1 .uc{font-size:11px;color:var(--color-text-secondary);font-weight:600}
.mini-case .l2{font-family:"SF Mono",Menlo,monospace;font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.mini-case .l3{font-size:11px;color:var(--color-text-secondary);margin-top:2px;display:flex;gap:8px}
.acc-h{display:flex;align-items:center;gap:8px;padding:12px 16px;font-weight:700;font-size:13px;cursor:pointer;user-select:none}
.acc-h .arr{margin-left:auto;transition:transform .15s;color:var(--color-text-secondary)}
.acc-h.open .arr{transform:rotate(90deg)}

/* 三系统查询页签 */
.qtabbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sys-strip{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.sys-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid}
.sys-pill.ok{color:var(--color-success);background:var(--color-success-50);border-color:#A7F3D0}
.sys-pill.warn{color:var(--color-warning);background:var(--color-warning-50);border-color:#FDE68A}
.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px}
.info-grid .ig{display:flex;align-items:center;padding:9px 2px;border-bottom:1px solid var(--color-surface-50);font-size:13px}
.info-grid .ig .k{width:88px;flex:none;color:var(--color-text-secondary)}
.info-grid .ig .v{flex:1;min-width:0;font-weight:600;color:var(--color-text);word-break:break-all}
.src-tag{font-size:10px;color:#94A3B8;background:var(--color-surface-50);border:1px solid var(--color-border);border-radius:4px;padding:0 5px;margin-left:8px;font-weight:600;white-space:nowrap;flex:none}

/* 回复函：邮件式富文本编辑器 */
.rte-bar{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.rte-bar button{border:1px solid var(--color-border);background:#fff;border-radius:6px;height:28px;font-size:12px;cursor:pointer;padding:0 9px;font-weight:600;color:var(--color-text)}
.rte-bar button:hover{background:var(--color-surface-50);border-color:var(--color-primary)}
.rte-bar select{height:28px;border:1px solid var(--color-border);border-radius:6px;background:#fff;font-size:12px;padding:0 4px}
.rte-bar .sep{width:1px;height:18px;background:var(--color-border);margin:0 4px}
.letter{width:100%;min-height:280px;padding:16px 20px;border:1.5px solid var(--color-border);border-radius:var(--radius);
  font-size:13.5px;line-height:2.1;font-family:"Songti SC","STSong","SimSun",serif;background:#fff;outline:none;overflow:auto}
.letter p{margin:0 0 10px;text-indent:2em}
.letter .ltr-title{text-align:center;font-weight:800;font-size:19px;margin-bottom:16px;letter-spacing:1px;text-indent:0}
.letter .noind{text-indent:0}
.letter .sig{text-align:right;text-indent:0}
.letter:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-50)}
.letter.ro{background:var(--color-surface-50);color:#334155}
.file-chip{display:inline-flex;align-items:center;gap:6px;background:var(--color-success-50);color:var(--color-success);
  border:1px solid #A7F3D0;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;margin-top:10px}

.bar-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px}
.bar-h .nm{width:110px;flex:none;text-align:right;color:var(--color-text-secondary);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-h .track{flex:1;height:18px;background:var(--color-surface-50);border-radius:4px;overflow:hidden;display:flex}
.bar-h .val{width:52px;flex:none;font-weight:700}
.legend{display:flex;gap:14px;font-size:11px;color:var(--color-text-secondary);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.reply-preview{border:1px dashed var(--color-border);border-radius:var(--radius);padding:16px;background:var(--color-surface-50);font-size:12.5px;line-height:1.9;max-height:220px;overflow:auto}
.choice-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice-card{border:1.5px solid var(--color-border);border-radius:var(--radius-lg);padding:20px;cursor:pointer;text-align:left;background:#fff;transition:border-color .15s,box-shadow .15s;font:inherit}
.choice-card:hover{border-color:var(--color-primary);box-shadow:var(--shadow-md)}
.choice-card .t{font-weight:700;font-size:14px;margin-bottom:6px}
.choice-card .d{font-size:12px;color:var(--color-text-secondary)}

/* 查询进行中动画 */
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.qsys{border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:22px;text-align:center;background:#fff}
.qsys .nm{font-weight:700;font-size:14px}
.qsys .stt{margin-top:8px;font-size:12px;font-weight:700;color:var(--color-text-secondary)}
.qsys.run .stt{animation:pulse 1.1s infinite;color:var(--color-primary)}
.qsys.ok{border-color:#A7F3D0;background:var(--color-success-50)} .qsys.ok .stt{color:var(--color-success);animation:none}
.qsys.warn{border-color:#FDE68A;background:var(--color-warning-50)} .qsys.warn .stt{color:var(--color-warning);animation:none}
.spinner{width:26px;height:26px;border:3px solid var(--color-border);border-top-color:var(--color-primary);border-radius:50%;
  margin:10px auto 0;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:900px){
  .sidebar{width:64px;padding:12px 4px}
  .sidebar .brand small,.nav-link span.txt,.sidebar .footer{display:none}
  .main{padding:16px}
  .grid-2,.grid-3,.choice-cards{grid-template-columns:1fr}
}
</style>
</head>

  <div class="card"><div class="card-header">月度趋势（2026年1–8月）</div><div class="card-body">

     <polygon points="${TREND.map((v,i)=>`${40+i*77},${190-v*10}`).join(' ')} 580,190 40,190" fill="rgba(37,99,235,.08)"/>
     <polyline points="${TREND.map((v,i)=>`${40+i*77},${190-v*10}`).join(' ')}" fill="none" stroke="#2563EB" stroke-width="2.5"/>

       <text x="${40+i*77}" y="206" font-size="11" text-anchor="middle" fill="#64748B">${i+1}月</text>`).join('')}

  <div class="card"><div class="card-header">投诉类型分布</div><div class="card-body" style="display:flex;align-items:center;gap:24px;justify-content:center">
    <svg width="150" height="150" viewBox="0 0 150 150">
      ${(()=>{let off=0;return TYPE.map(([n,p,col])=>{const el=`<circle cx="75" cy="75" r="54" fill="none" stroke="${col}" stroke-width="22"
        stroke-dasharray="${p*3.393} ${339.3-p*3.393}" stroke-dashoffset="${-off*3.393}" transform="rotate(-90 75 75)"/>`;off+=p;return el}).join('')})()}
      <text x="75" y="72" text-anchor="middle" font-size="22" font-weight="800">46</text>

     <td>${t.type}</td><td>${badge(t.status)}</td><td>${t.coop?coopIcon(t.coop):'<span class="hint">—</span>'}</td></tr>`).join('')}

/* ================= 撤诉弹窗 ================= */
function askWithdraw(){
 document.getElementById('modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-content">
  <div class="m-head">标记撤诉</div><div class="m-body">
   <p style="margin-bottom:10px">确认将 <b>${c().name}</b> 的投诉标记为「已撤诉」？</p>
   <ul class="hint" style="padding-left:18px;line-height:1.9">
    <li>统计中自动移出有效投诉，单独列入撤诉列</li><li>案件记录与档案资料永久保留</li>
    <li>已归档案件将自动向原档案夹补充撤诉说明</li></ul>
   <input class="form-control" style="margin-top:10px" placeholder="撤诉原因（选填）">
  </div><div class="m-foot"><button class="btn btn-secondary" onclick="closeModal()">取消</button>
  <button class="btn btn-danger" onclick="doWithdraw()">确认撤诉</button></div></div></div>`;
}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function doWithdraw(){c().status='withdrawn';closeModal();toast('已标记撤诉：统计已移出有效投诉，档案同步更新','success');render()}

/* ================= 路由与渲染 ================= */
function render(){
 const view=location.hash.replace('#/','').split('?')[0]||'list';
 const q=(location.hash.match(/v=([ABC])/)||[])[1];
 if(q)VARIANTS[q]&&(S.variant=q);
 S.view=view;nav(view==='query'?'intake':view);
 const t=c();let html='';
 if(view==='intake')html=vIntake();
 else if(view==='query')html=vQuery();
 else if(view==='dash')html=vDash();
 else if(view==='case')html=S.variant==='A'?caseA(t):S.variant==='B'?caseB(t):caseC(t);
 else html=vList();
 document.getElementById('view').innerHTML=html;
 const lbl=document.getElementById('sw-label');
 lbl.textContent=view==='case'?`工作台布局 ${S.variant} · ${VARIANTS[S.variant]}`:`点此进入案件 → 体验布局 ${VARIANTS[S.variant]}`;
}
document.getElementById('sw-prev').onclick=()=>cycle(-1);
document.getElementById('sw-next').onclick=()=>cycle(1);
function cycle(d){const keys=['A','B','C'];let i=keys.indexOf(S.variant);i=(i+d+3)%3;
 if(S.view!=='case')go('case');setVariant(keys[i])}
window.addEventListener('hashchange',render);
window.addEventListener('keydown',e=>{
 if(['INPUT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable)return;
 if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});
render();
</script>
